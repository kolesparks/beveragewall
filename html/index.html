<!DOCTYPE html>
<html>

<head>
    <title>Beverage Wall</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Add your beverage to the wall." />
    <style>
        html {
            font-family: sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
            font-variation-settings:
                "GRAD" 0;
            overflow: hidden;
            max-height: 100%;
            height: 100%;
        }

        body {
            background-color: #F9F8F6;
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: auto;
        }

        form input[type="file"] {
            display: none;
        }

        .add-beverage-button {
            position: fixed;
            bottom: 1.5em;
            right: 1.5em;
            border: 1px solid #000;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3em;
            height: 3em;
            cursor: pointer;
            border-radius: 50%;
            background-color: #EFE9E3;
            box-shadow: #000;
        }

        ol {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0;
            margin: 0;
            margin-top: 5px;
        }

        li {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            list-style: none;
            border: 1px solid #D9CFC7;
            border-radius: 5px;
            padding: 10px;
            width: 80%;
            max-width: 400px;
            height: 400px;
            background-color: #EFE9E3;

        }

        li:last-child {
            margin-bottom: 2em;
        }

        img {
            height: 100%;
            width: 100%;
            object-fit: contain;
            overflow: hidden;
        }


        button {
            border-radius: 5px;
            border-width: 1px;
            border-color: #000;
            background-color: #D9CFC7;
            padding: 1em;
            width: 100%;
            cursor: pointer;
        }


        .disclaimer {
            font-size: 0.75em;
            opacity: 0.81;
        }


        .error {
            color: rgba(222, 56, 56, 0.694);
            font-size: 1.5em;
            font-weight: 500;
            text-align: center;
        }
    </style>


</head>

<body>
    <form id="beverage-upload-form" action="/" method="post" enctype="multipart/form-data">
        <label for="image-input" class="add-beverage-button">
            +🍺
        </label>
        <input id="image-input" type="file" name="image" required />
    </form>
    $UPLOAD_ERROR
    <ol>
        <li id="preview-list-item" hidden>
            <img src="" />
            <p class="disclaimer">Images are sent to <a href="https://openrouter.ai" target="_blank"
                    rel="noreferrer">OpenRouter</a> for beverage detection.</p>
            <button form="beverage-upload-form" type="submit">Upload Beverage</button>

        </li>
        <script>
            const imageInput = document.getElementById("image-input");
            const form = document.getElementById("beverage-upload-form");
            const previewListItem = document.getElementById("preview-list-item");
            const previewImg = previewListItem.querySelector("img");
            imageInput.addEventListener('change', (e) => {
                const [file] = imageInput.files;
                if (file) {
                    previewListItem.hidden = false;
                    previewListItem.style.display = 'flex';
                    previewImg.src = URL.createObjectURL(file);
                }
            });

            form.addEventListener("submit", () => {
                const button = previewListItem.querySelector("button");
                button.textContent = "Uploading...";
            });
        </script>
        $BEVERAGES
    </ol>
    <nav>
        $PAGE_LINKS
    </nav>

    <footer>
        <p>
            Hand crafted by <a href="https://kolesparks.com" target="_blank" rel="noreferrer">Kole Sparks</a>. Open
            Source on <a href="https://github.com/kolesparks/headlinefilter" target="_blank"
                rel="noreferrer">GitHub</a>. Hosted on <a href="https://railway.com?referralCode=ABSfL6"
                rel="noreferrer">Railway</a>.
        </p>
    </footer>
</body>

</html>
