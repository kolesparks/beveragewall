<!DOCTYPE html>
<html>

<head>
    <title>Beverage Wall</title>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="Add your beverage to the wall." />
    <style>
        html {
            font-family: sans-serif;
            font-optical-sizing: auto;
            font-style: normal;
            font-variation-settings:
                "GRAD" 0;
            overflow: hidden;
            max-height: 100%;
            height: 100%;
            color: var(--font-color);
        }

        body {
            background-color: var(--bg-color);
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: auto;
        }

        form input[type="file"] {
            display: none;
        }

        .add-beverage-button {
            position: fixed;
            bottom: 2.5em;
            right: 2em;
            border: 1px solid var(--font-color);
            display: flex;
            align-items: center;
            justify-content: center;
            width: 3em;
            height: 3em;
            cursor: pointer;
            border-radius: 50%;
            background-color: var(--fg-color);
        }

        ol {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            gap: 10px;
            padding: 0;
            margin: 0;
            margin-top: 1em;
        }

        li {
            flex-direction: column;
            align-items: center;
            justify-content: center;
            list-style: none;
            border: 1px solid var(--primary-color);
            border-radius: 5px;
            padding: 10px;
            width: 80%;
            max-width: 400px;
            height: 400px;
            background-color: var(--fg-color);

        }

        li:last-child {
            margin-bottom: 2em;
        }

        img {
            height: 100%;
            width: 100%;
            object-fit: contain;
            overflow: hidden;
        }


        button {
            border-radius: 5px;
            border-width: 1px;
            border-color: var(--font-color);
            background-color: var(--primary-color);
            padding: 1em;
            width: 100%;
            cursor: pointer;
            color: var(--font-color);
        }


        .disclaimer {
            font-size: 0.75em;
            opacity: 0.81;
        }


        .error {
            color: var(--error-color);
            font-size: 1.5em;
            font-weight: 500;
            text-align: center;
        }

        nav {
            display: flex;
            flex-direction: row;
            gap: 2em;
            align-items: center;
            justify-content: center;
            width: 100%;
            margin-bottom: 1.5em;
        }

        .page-number {
            font-size: 1em;
            color: var(--font-color);
            text-decoration: none;
        }

        .page-number[data-current='true'] {
            text-decoration: underline;
        }

        #image-compression-canvas {
            /* attempt to prevent overlay bug on android by removing canvas completely out of viewport*/
            display: none;
            position: absolute;
            left: -200vw;
        }


        footer {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            margin-bottom: 1.5em;
        }

        @media (prefers-color-scheme: light) {
            :root {
                --bg-color: #F9F8F6;
                --font-color: #000;
                --fg-color: #EFE9E3;
                --primary-color: #D9CFC7;
                --error-color: rgba(222, 56, 56, 0.694);
            }
        }

        @media (prefers-color-scheme: dark) {
            :root {
                --bg-color: #222831;
                --font-color: #EEEEEE;
                --fg-color: #31363F;
                --primary-color: #3d434e;
                --error-color: rgba(222, 56, 56, 0.694);
            }

            a:visited {
                color: #76ABAE;
            }

            a {
                color: #87c3c6;
            }
        }
    </style>


</head>

<body>
    <form id="beverage-upload-form" action="/" method="post" enctype="multipart/form-data">
        <label for="image-input" class="add-beverage-button">
            +🍺
        </label>
        <input id="image-input" type="file" name="image" capture="camera" accept="image/*" required />
    </form>
    $UPLOAD_ERROR

    <canvas id="image-compression-canvas" hidden></canvas>
    <ol>
        <li id="preview-list-item" hidden>
            <img src="" />
            <p class="disclaimer">Images are sent to <a href="https://openrouter.ai" target="_blank"
                    rel="noreferrer">OpenRouter</a> for beverage detection.</p>
            <button form="beverage-upload-form" type="submit">Upload Beverage</button>

        </li>
        <script>
            const imageInput = document.getElementById("image-input");
            const form = document.getElementById("beverage-upload-form");
            const previewListItem = document.getElementById("preview-list-item");
            const previewImg = previewListItem.querySelector("img");
            const canvas = document.getElementById("image-compression-canvas");
            imageInput.addEventListener('change', (e) => {
                const [file] = imageInput.files;
                if (file) {
                    previewListItem.hidden = false;
                    previewListItem.style.display = 'flex';
                    previewImg.src = URL.createObjectURL(file);

                    if (file.size > 1024 * 1024) {
                        canvas.src = previewImg.src;
                        createImageBitmap(file).then(imageBitmap => {
                            canvas.width = imageBitmap.width / 4;
                            canvas.height = imageBitmap.height / 4;
                            canvas.hidden = true;
                            const scale = Math.min(canvas.width / imageBitmap.width, canvas.height / imageBitmap.height);
                            const width = imageBitmap.width * scale;
                            const height = imageBitmap.height * scale;
                            const x = canvas.width / 2 - width / 2;
                            const y = canvas.height / 2 - height / 2;

                            canvas.getContext('2d').drawImage(imageBitmap, x, y, width, height)
                            canvas.toBlob((blob) => {
                                const file = new File([blob], "beverage.jpg", { type: "image/jpeg", lastModified: new Date().getTime() });
                                const dt = new DataTransfer();

                                dt.items.add(file);
                                imageInput.files = dt.files;
                            }, 'image/jpeg', 1);

                        })
                    }

                }
            });

            form.addEventListener("submit", () => {
                const button = previewListItem.querySelector("button");
                button.textContent = "Uploading...";
            });
        </script>
        $BEVERAGES
    </ol>
    <nav>
        $PAGE_LINKS
    </nav>

    <footer>
        <p>
            Hand crafted by <a href="https://kolesparks.com" target="_blank" rel="noreferrer">Kole Sparks</a>. Open
            Source on <a href="https://github.com/kolesparks/headlinefilter" target="_blank"
                rel="noreferrer">GitHub</a>. Hosted on <a href="https://railway.com?referralCode=ABSfL6"
                rel="noreferrer">Railway</a>.
        </p>
    </footer>
</body>

</html>
